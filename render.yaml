services:
  - type: web
    name: daily-rhythm-habit-tracker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /opt/render/project/src/storage
    disk:
      name: habit-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
